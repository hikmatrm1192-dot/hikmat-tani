name: HIKMAT TANI Map Boundary Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  map-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Administrative boundary regression
        run: npm run test:map-admin
