name: Apply official Jawa Barat administrative boundaries

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-and-verify:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(auto): apply official Jawa Barat boundaries') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply official boundary integration patch
        run: node scripts/patch-official-admin-boundaries.mjs

      - name: Type check
        run: npm run lint

      - name: Administrative boundary regression test
        run: npx tsx tests/administrative-boundary-completeness.test.ts

      - name: Production build
        run: npm run build

      - name: Commit integrated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/peta/PetaPertanianView.tsx src/modules/peta/AgriculturalMap.tsx src/modules/peta/SaveDrawnParcelModal.tsx tests/administrative-boundary-completeness.test.ts
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "chore(auto): apply official Jawa Barat boundaries"
          git push origin HEAD:main
