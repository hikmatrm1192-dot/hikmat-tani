name: HIKMAT TANI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run lint

      - name: Polygon tap regression
        run: npm run test:polygon-tap

      - name: Full regression suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Cloudflare Wrangler dry-run validation
        run: npx wrangler deploy --dry-run

      - name: Live production non-mutating smoke
        run: npm run test:live-health
