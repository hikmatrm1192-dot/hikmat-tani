name: HIKMAT TANI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PROD_URL: https://app.hikmattani.id

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run lint

      - name: Polygon tap regression
        run: npm run test:polygon-tap

      - name: Full regression suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Cloudflare Wrangler dry-run validation
        run: npx wrangler deploy --dry-run

      - name: Resolve production IPv4 through Cloudflare DNS
        id: resolve-production-dns
        shell: bash
        run: |
          set -euo pipefail
          ip="$(curl --fail --silent --show-error \
            'https://cloudflare-dns.com/dns-query?name=app.hikmattani.id&type=A' \
            -H 'accept: application/dns-json' \
            | jq -r '.Answer[]? | select(.type == 1) | .data' \
            | head -n 1)"
          test -n "$ip"
          echo "Resolved app.hikmattani.id to $ip through Cloudflare DNS-over-HTTPS"
          echo "PROD_IP=$ip" >> "$GITHUB_ENV"

      - name: Live production non-mutating smoke
        run: npm run test:live-health
